[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coldemailos"
version = "1.0.0"
description = "Zero-cost cold email infrastructure for B2B SaaS founders"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Minis Agent", email = "leadforge@sendinblue.com"}]
maintainers = [{name = "Minis Agent", email = "leadforge@sendinblue.com"}]
keywords = ["email", "cold-email", "brevo", "saas", "marketing", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "email-validator>=2.2.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "sqlalchemy>=2.0.34",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pre-commit>=3.8.0",
    "locust>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/HCTDIP/coldemailos"
Repository = "https://github.com/HCTDIP/coldemailos"
Issues = "https://github.com/HCTDIP/coldemailos/issues"
Documentation = "https://coldemailos.dev/docs"

[project.scripts]
coldemailos = "src.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "T20", "TID", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET", "SIM", "TCH", "EXE", "ISC", "ICN", "PT", "QF", "RUF", "LOG"]
ignore = ["ANN101", "ANN102", "T201", "T203", "ARG001", "ARG002", "B008", "C901", "PLW2901", "PTH118", "PTH123"]
exclude = ["tests/", ".venv/", "dist/", "build/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
exclude = ["tests/", "deploy/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
precision = 2